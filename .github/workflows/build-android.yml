name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    concurrency:
      group: publish-downloads
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        working-directory: android-app
        run: npm install

      - name: Auto increment Android version
        id: version
        shell: bash
        run: |
          FILE="android-app/android/app/build.gradle"

          CURRENT_VERSION=$(grep -oP 'versionName\s+"\K[^"]+' "$FILE")
          CURRENT_CODE=$(grep -oP 'versionCode\s+\K[0-9]+' "$FILE")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i -E "s/versionCode [0-9]+/versionCode $NEW_CODE/" "$FILE"
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"$NEW_VERSION\"/" "$FILE"

          echo "Old version: $CURRENT_VERSION"
          echo "New version: $NEW_VERSION"
          echo "Old versionCode: $CURRENT_CODE"
          echo "New versionCode: $NEW_CODE"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Sync web assets into the Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android-app/android/gradlew

      # Decodes the fixed signing keystore (stored as a base64 GitHub Secret)
      # to a file — this is what makes every build share the same signature,
      # so Android accepts each new APK as an update instead of treating it
      # as a "different" app that conflicts with the one already installed.
      - name: Decode signing keystore
        run: echo "${{ secrets.LAGOBIN_KEYSTORE_BASE64 }}" | base64 -d > android-app/android/app/lagobin-release.keystore

      - name: Build debug APK
        working-directory: android-app/android
        env:
          LAGOBIN_KEYSTORE_PATH: app/lagobin-release.keystore
          LAGOBIN_KEYSTORE_PASSWORD: ${{ secrets.LAGOBIN_KEYSTORE_PASSWORD }}
          LAGOBIN_KEY_ALIAS: ${{ secrets.LAGOBIN_KEY_ALIAS }}
          LAGOBIN_KEY_PASSWORD: ${{ secrets.LAGOBIN_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagoBinAdmin-android
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare downloads
        run: |
          mkdir -p downloads

          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk \
             downloads/LagoBinAdmin-android.apk

          cat > downloads/version-android.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "notes": "",
            "releasedAt": "$(date -u +%Y-%m-%d)"
          }
          EOF

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files that should be published
          git add \
            android-app/android/app/build.gradle \
            downloads/LagoBinAdmin-android.apk \
            downloads/version-android.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi

          git commit -m "Auto-publish Android admin app v${{ steps.version.outputs.version }} [skip ci]"

          # Discard all remaining build-generated changes
          git reset --hard HEAD

          # Get the latest main branch
          git fetch origin main

          # Rebase the commit we just created
          git rebase origin/main

          git push origin main
