name: Build Android APK

# Runs on every push to main that touches the android-app folder, and can
# also be triggered manually from the GitHub Actions tab ("Run workflow") —
# same idea as the Windows exe build, just scoped to its own subfolder so
# it doesn't run every time you change something in the Windows project.
on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the built APK + version.json back into downloads/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        working-directory: android-app
        run: npm install

      - name: Sync web assets into the Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android-app/android/gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      # Debug build = installable straight on the tablet ("unknown sources"),
      # no Play Store / signing certificate needed — same philosophy as the
      # unsigned Windows portable .exe.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagoBinAdmin-android
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      # Read the version straight out of build.gradle so it can never drift
      # out of sync with what's actually inside the APK — bump versionName
      # (and versionCode) there before pushing a release.
      - name: Extract version name
        id: appversion
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android-app/android/app/build.gradle)
          echo "Detected versionName: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Publishes the APK + a small version.json to the same public
      # downloads/ folder the Windows exe uses (served via GitHub Pages) —
      # this is what the in-app "new version available" banner reads.
      - name: Publish APK + version.json to downloads
        run: |
          mkdir -p downloads
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/LagoBinAdmin-android.apk
          cat > downloads/version-android.json <<EOF
          { "version": "${{ steps.appversion.outputs.version }}", "notes": "" }
          EOF

      - name: Commit and push to downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/LagoBinAdmin-android.apk downloads/version-android.json
          git diff --cached --quiet || git commit -m "Auto-publish Android admin app v${{ steps.appversion.outputs.version }}"
          git push
