name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm dependencies
        working-directory: android-app
        run: npm install

      - name: Sync web assets into the Android project
        working-directory: android-app
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android-app/android/gradlew

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LagoBinAdmin-android
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Extract version name
        id: appversion
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' android-app/android/app/build.gradle)
          echo "Detected versionName: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish APK + version.json to downloads
        run: |
          mkdir -p downloads
          cp android-app/android/app/build/outputs/apk/debug/app-debug.apk downloads/LagoBinAdmin-android.apk
          cat > downloads/version-android.json <<EOF
          { "version": "${{ steps.appversion.outputs.version }}", "notes": "" }
          EOF

      - name: Commit and push to downloads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/LagoBinAdmin-android.apk downloads/version-android.json
          git diff --cached --quiet || git commit -m "Auto-publish Android admin app v${{ steps.appversion.outputs.version }}"
          git push
