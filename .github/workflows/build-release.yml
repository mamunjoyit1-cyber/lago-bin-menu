name: Build and Publish Admin App

on:
  push:
    branches: [main]
    paths:
      - 'electron-app/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: electron-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows app
        run: npm run build:win

      - name: Read version from package.json
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check build output
        shell: bash
        run: |
          echo "=== dist folder ==="
          ls -la dist || true
          echo "=== Looking for EXE ==="
          find dist -type f -iname "*.exe" -print || true

      - name: Publish exe and version.json to downloads/
        shell: bash
        run: |
          mkdir -p ../downloads

          EXE=$(find dist -maxdepth 1 -type f -iname "*.exe" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "ERROR: No .exe file was found in dist/"
            exit 1
          fi

          echo "Found EXE: $EXE"

          cp "$EXE" ../downloads/LagoBinAdmin.exe

          cat > ../downloads/version.json <<EOF
          {
            "version": "${{ steps.pkg.outputs.version }}",
            "notes": "Build automatico da GitHub Actions.",
            "releasedAt": "$(date -u +%Y-%m-%d)"
          }
          EOF

      - name: Commit and push updated downloads/
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add downloads/LagoBinAdmin.exe downloads/version.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
          else
            git commit -m "Auto-publish admin app v${{ steps.pkg.outputs.version }}"
            git push
          fi
