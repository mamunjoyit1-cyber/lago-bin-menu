name: Build and Publish Admin App

on:
  push:
    branches: [main]
    paths:
      - 'electron-app/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    concurrency:
      group: publish-downloads
      cancel-in-progress: false

    defaults:
      run:
        working-directory: electron-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Auto increment Windows version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          npm version "$NEW_VERSION" --no-git-tag-version

          echo "Old version: $VERSION"
          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build portable Windows app
        run: npm run build:win

      - name: Check build output
        shell: bash
        run: |
          echo "=== dist folder ==="
          ls -la dist || true

          echo "=== Looking for EXE ==="
          find dist -type f -iname "*.exe" -print || true

      - name: Publish exe and version.json
        shell: bash
        run: |
          mkdir -p ../downloads

          EXE=$(find dist -maxdepth 1 -type f -iname "*.exe" | head -n 1)

          if [ -z "$EXE" ]; then
            echo "ERROR: No .exe file was found in dist/"
            exit 1
          fi

          echo "Found EXE: $EXE"

          cp "$EXE" ../downloads/LagoBinAdmin.exe

          cat > ../downloads/version.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "notes": "Build automatico da GitHub Actions.",
            "releasedAt": "$(date -u +%Y-%m-%d)"
          }
          EOF

      - name: Commit and push
        shell: bash
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add electron-app/package.json downloads/LagoBinAdmin.exe downloads/version.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare"
            exit 0
          fi

          git commit -m "Auto-publish Windows admin app v${{ steps.version.outputs.version }}"

          git pull --rebase origin main

          git push origin main
